name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit tests (untagged)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
      - name: go test ./...
        run: go test ./...

  integration:
    name: B7 Track 1 — integration
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
      - name: integration tests
        run: go test -tags=integration -v -timeout 10m ./examples/...

  dogfood:
    name: B7 Track 2 — dogfood
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
      - name: dogfood gate
        run: go test -tags=dogfood -v -timeout 10m ./examples/...
      - name: upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dogfood-reports
          path: .harness/reports/
          if-no-files-found: ignore
