name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust tests
        run: cargo test -p lastro-core
      - name: Clippy
        run: cargo clippy -p lastro-core -- -D warnings
      - name: Install
        run: npm install
      - name: Build WASM prover
        run: npm run wasm
      - name: SDK tests
        run: npm test -w lastro
      - name: Sandbox build
        run: npm run build -w @lastro/sandbox
