name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust tests
        run: cargo test -p lastro-core
      - name: Clippy
        run: cargo clippy -p lastro-core -- -D warnings
      - name: Install
        run: npm install
      - name: Build WASM prover
        run: npm run wasm
      - name: SDK tests
        run: npm test -w lastro
      - name: Sandbox build
        run: npm run build -w @lastro/sandbox
  dotnet:
    runs-on: ubuntu-latest
    env:
      LASTRO_REQUIRE_CROSSCHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build the Rust prover CLI
        run: cargo build --release -p lastro-core --bin lastro-prove
      - name: Build the TypeScript SDK (for the cross-check)
        run: npm install && npx tsc -p packages/sdk
      - name: .NET SDK tests
        run: dotnet test packages/dotnet
