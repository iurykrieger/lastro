name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust tests
        run: cargo test -p lastro-core
      - name: Clippy
        run: cargo clippy -p lastro-core -- -D warnings
      - name: Install
        run: npm install
      - name: Build WASM prover
        run: npm run wasm
      - name: SDK tests
        run: npm test -w lastro
      - name: Plugin tests (Claude Code and Codex hooks, through the real CLI)
        run: npm test -w @lastro/plugin
      - name: Claude Code plugin checks (manifests, the lastro-board mod's tests)
        run: |
          npx -y @anthropic-ai/claude-code@2.1.322 plugin validate .
          npx -y @anthropic-ai/claude-code@2.1.322 plugin validate plugins/lastro
          npx -y @anthropic-ai/claude-code@2.1.322 plugin validate plugins/lastro-board
          npx -y @anthropic-ai/claude-code@2.1.322 plugin test plugins/lastro-board
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdks/go/go.mod
          cache-dependency-path: sdks/go/go.sum
      - name: Rust prover binary (for the Go cross-check)
        run: cargo build --release -p lastro-core --bin lastro-prove
      - name: Go SDK tests (cross-checked with the TS SDK and the Rust prover)
        working-directory: sdks/go
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...
      - name: Sandbox build
        run: npm run build -w @lastro/sandbox
  dotnet:
    runs-on: ubuntu-latest
    env:
      LASTRO_REQUIRE_CROSSCHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build the Rust prover CLI
        run: cargo build --release -p lastro-core --bin lastro-prove
      - name: Build the TypeScript SDK (for the cross-check)
        run: npm install && npx tsc -p sdks/typescript
      - name: .NET SDK tests
        run: dotnet test sdks/dotnet
      - name: .NET docs example (replays the quickstart answers)
        working-directory: apps/docs/examples/shipping/dotnet
        run: dotnet run -- --replay
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdks/go/go.mod
          cache-dependency-path: apps/docs/examples/shipping/go-library/go.sum
      - name: Install
        run: npm install
      - name: Build the WASM prover and the TS SDK
        run: npm run wasm && npm run build -w lastro
      - name: Docs examples (the quickstart and the library example, through the real SDK)
        run: npm run test:examples -w @lastro/docs
      - name: Go docs example
        working-directory: apps/docs/examples/shipping/go-library
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./... && go test ./...
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/docs
      - name: Docs UI tests (Playwright)
        run: npm run test:e2e -w @lastro/docs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docs-playwright-report
          path: apps/docs/playwright-report
          retention-days: 7
