[package]
name = "lastro-core"
version = "0.1.0"
edition = "2021"
description = "Lastro proof core: LSL evaluation, exhaustive finite-domain proofs, mutation and consistency checks, SMT-LIB export. Builds natively and to WASM."
license = "UNLICENSED"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
