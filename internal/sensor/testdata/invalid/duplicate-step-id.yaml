# Two steps share id "probe" — schema allows individual ids but not
# uniqueness, which intrinsic validation enforces.
schema_version: 1.0.0
id: dup-step-id-sensor
use_case_id: create-order-use-case
angle: build
kind: assertion
nature: computational
output_type: single-shot
uses:
  - node
steps:
  - id: probe
    run: "echo first"
  - id: probe
    run: "echo second"
