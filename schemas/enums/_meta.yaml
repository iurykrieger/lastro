$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://lastro.dev/harness/schemas/enums/_meta.yaml"
title: EnumFileMeta
description: |
  Shape every file in schemas/enums/*.yaml must follow. Enum files are
  canonical structured data; this meta-schema is the only JSON Schema that
  lives under enums/.

type: object
required: [schema_version, title, values]
additionalProperties: false

properties:
  schema_version:
    type: string
    pattern: "^\\d+\\.\\d+\\.\\d+$"
  title:
    type: string
    minLength: 1
  description:
    type: string
  values:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, purpose]
      additionalProperties: true
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9-]*$"
          minLength: 1
          maxLength: 128
        purpose:
          type: string
          minLength: 1
