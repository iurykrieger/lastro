# Sensor example — assertion / computational / single-shot.
# Code-structure sensor: ESLint lints the order handler for style violations.
schema_version: 1.0.0
id: code-structure-create-order-sensor
use_case_id: create-order-use-case
angle: code-structure
kind: assertion
nature: computational
output_type: single-shot

uses:
  - node
  - eslint

steps:
  - id: lint
    run: "npx eslint src/handlers/orders.ts --format compact"
signal_matches:
  - { key: lint-clean, pattern: "0 problems", verdict: pass }
  - { key: lint-errors, pattern: "[1-9][0-9]* error", verdict: fail, heal_hint: { summary: "ESLint reported errors", rationale: "Fix linting violations in src/handlers/orders.ts." } }
