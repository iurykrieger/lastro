# Sensor example — assertion / computational / stream.
# Contracts sensor: validates the OpenAPI spec and gRPC proto in one pass.
schema_version: 1.0.0
id: contracts-create-order-sensor
use_case_id: create-order-use-case
angle: contracts
kind: assertion
nature: computational
output_type: stream

uses:
  - express
  - grpc

steps:
  - id: lint-openapi
    run: "npx @redocly/cli lint src/api.yaml --format compact"
  - id: compile-proto
    run: "protoc --proto_path=. --descriptor_set_out=/dev/null api.proto"
signal_matches:
  - { key: spec-error, pattern: "[Ee]rror", verdict: fail, heal_hint: { summary: "Contract violation found", rationale: "Fix the OpenAPI spec or proto file to match the declared interface." } }
