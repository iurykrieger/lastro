schema_version: 1.0.0
id: run-dev
scope: core
angle: environment
kind: observational
nature: computational
output_type: stream
uses: []
signal_matches:
  # Readiness: servicemgr.Acquire blocks until this key appears.
  - key: ready
    pattern: "ready|started server|compiled successfully"
    verdict: pass
    expected: true
  # Firehose: emit every server log line so attaching sensors (e.g. logs)
  # can grep matched_line for their own patterns.
  - key: log-line
    pattern: ".+"
    verdict: pass
  - key: startup-error
    pattern: "Error|error|fatal"
    verdict: fail
    heal_hint:
      summary: "Service failed to start"
      rationale: "Check the server logs for the failing service."
steps:
  - id: boot
    run: "make dev"
