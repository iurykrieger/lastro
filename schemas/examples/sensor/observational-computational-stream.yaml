# Sensor example — observational / computational / stream.
# Log-tail with structured matchers derived from the log library.
schema_version: 1.0.0
id: logs-create-order-sensor
use_case_id: create-order-use-case
angle: logs
kind: observational
nature: computational
output_type: stream

uses:
  - node
  - express

steps:
  - id: tail-logs
    run: "docker logs --follow --since 0s orders-service 2>&1"
signal_matches:
  - { key: order-created-log, pattern: "\"level\":\"info\".*\"event\":\"order\\.created\"", verdict: pass, expected: true }
  - { key: order-error-log, pattern: "\"level\":\"error\".*\"event\":\"order\\.created\"", verdict: fail, heal_hint: { summary: "Order creation logged as error", rationale: "Check orders-service handler for uncaught exceptions." } }
