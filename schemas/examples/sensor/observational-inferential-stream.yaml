# Sensor example — observational / inferential / stream.
# Log-tail with semantic patterns for order correctness (confidence < 1.0 because patterns
# are derived from use-case text, not from a fixed schema).
schema_version: 1.0.0
id: semantic-logs-create-order-sensor
use_case_id: create-order-use-case
angle: logs
kind: observational
nature: inferential
output_type: stream

uses:
  - node

steps:
  - id: tail-logs
    run: "docker logs --follow --since 0s orders-service 2>&1"
signal_matches:
  - { key: order-success, pattern: "order[._-]creat", verdict: pass, confidence: 0.8, expected: true }
  - { key: order-failure, pattern: "(error|fail|exception).*order", verdict: fail, confidence: 0.8, heal_hint: { summary: "Order creation error in logs", rationale: "Inspect orders-service logs for the exception causing the failure." } }
