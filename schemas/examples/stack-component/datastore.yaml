# StackComponent example — datastore kind (Postgres).
schema_version: 1.0.0
id: postgres
kind: datastore
name: postgres
version: 16.x
capabilities:
  - transactions
  - row-level-security
  - logical-replication
detection_evidence:
  - file: docker-compose.yaml
    path: services.db.image
    value: postgres:16
  - file: package.json
    path: dependencies.pg
    value: ^8.11.0
