$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://lastro.dev/harness/schemas/sensor.yaml"
title: Sensor
description: |
  Grounded validator produced for one (use case × applicable validation
  angle). Top-level `uses:` lists StackComponent ids (grounding invariant).
  Step-level `uses:` is a scalar primitive-sensor id for composition; paired
  with optional `with:` map of input overrides. Step `run:` and `uses:` are
  mutually exclusive (oneOf discriminated union).

type: object
required: [schema_version, id, angle, kind, nature, output_type, uses, steps]
additionalProperties: false

properties:
  schema_version:
    type: string
    pattern: "^\\d+\\.\\d+\\.\\d+$"
  id:
    $ref: "#/$defs/Id"
  scope:
    type: string
    description: "Canonical source: schemas/enums/sensor-scopes.yaml"
    enum: [core, use-case]
    default: use-case
  use_case_id:
    $ref: "#/$defs/Id"
  angle:
    type: string
    description: "Canonical source: schemas/enums/validation-angles.yaml"
    enum: [security, build, code-structure, unit-test, e2e-test,
           contracts, logs, metrics, database, performance, environment]
  kind:
    type: string
    description: "Canonical source: schemas/enums/sensor-kinds.yaml"
    enum: [assertion, observational]
  nature:
    type: string
    description: "Canonical source: schemas/enums/sensor-natures.yaml"
    enum: [computational, inferential]
  output_type:
    type: string
    description: "Canonical source: schemas/enums/signal-output-types.yaml"
    enum: [single-shot, stream]
  uses:
    type: array
    description: "StackComponent ids the sensor draws from (grounding invariant)"
    items: { $ref: "#/$defs/Id" }
  depends_on:
    type: array
    description: "Sensor ids that must pass before this one runs"
    items: { $ref: "#/$defs/Id" }
  steps:
    type: array
    minItems: 1
    items: { $ref: "#/$defs/SensorStep" }
  inputs:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      properties:
        required:    { type: boolean, default: false }
        default:     { type: string }
        description: { type: string }
  outputs:
    type: object
    additionalProperties:
      type: object
      required: [from]
      additionalProperties: false
      properties:
        from:        { type: string, minLength: 1 }
        description: { type: string }
  signal_matches:
    type: array
    description: |
      Regex matchers (Go RE2) applied to every stdout/stderr line of any sensor.
      Each match synthesizes a Signal carrying `verdict` and the named capture
      groups as evidence. `expected: true` (pass matchers only) feeds completeness.
    items:
      type: object
      required: [key, pattern]
      additionalProperties: false
      properties:
        key:        { $ref: "#/$defs/Id" }
        pattern:    { type: string, minLength: 1 }
        verdict:    { type: string, enum: [pass, warn, fail, inconclusive] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        expected:   { type: boolean }
        heal_hint:
          type: object
          required: [summary, rationale]
          additionalProperties: false
          properties:
            summary:   { type: string, minLength: 1 }
            rationale: { type: string, minLength: 1 }

allOf:
  - if:
      anyOf:
        - not: { required: [scope] }
        - properties: { scope: { const: use-case } }
    then:
      required: [use_case_id]
  - if:
      properties: { scope: { const: core } }
      required: [scope]
    then:
      not: { required: [use_case_id] }

$defs:
  Id:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
    minLength: 1
    maxLength: 128
  SensorStep:
    type: object
    required: [id]
    additionalProperties: false
    oneOf:
      - required: [run]
        not: { required: [uses] }
        properties: { with: false }
      - required: [uses]
        not: { required: [run] }
    properties:
      id:   { $ref: "#/$defs/Id" }
      run:  { type: string, minLength: 1 }
      uses: { $ref: "#/$defs/Id" }
      with:
        type: object
        additionalProperties: { type: string }
