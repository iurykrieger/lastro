$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://lastro.dev/harness/schemas/stack-manifest.yaml"
title: StackManifest
description: |
  The full detected stack for a repository: its archetype plus the ordered
  list of detected StackComponents. Produced by /detect-stack and consumed
  by every other harness skill as the "toolbox" that grounds sensor
  generation.

type: object
required: [schema_version, archetype, applicable_angles, components]
additionalProperties: false

properties:
  schema_version:
    type: string
    pattern: "^\\d+\\.\\d+\\.\\d+$"
  applicable_angles:
    type: array
    minItems: 1
    items:
      type: string
    description: |
      Derived field. Populated by stack.Persist from the manifest's
      archetype via internal/enums.ApplicableAngles[archetype]. The
      canonical source of truth is schemas/enums/archetypes.yaml's
      per-value applicable_angles list. Never authored by the LLM.
  env_file:
    type: string
    minLength: 1
    description: |
      Optional project-root-relative path to the dotenv file the
      application itself loads (e.g. ".env", ".env.local"). The runtime
      loads it for every sensor step, host environment winning on
      conflicts, so recipes see the same configuration the app does.
  archetype:
    type: string
    description: |
      The repository's archetype. Canonical source is
      schemas/enums/archetypes.yaml; this inline enum stays in sync via the
      drift contract.
    enum:
      - http-api
      - event-consumer
      - event-producer
      - cli
      - sdk
      - library
      - worker
      - batch-job
      - static-site
  components:
    type: array
    minItems: 1
    items:
      $ref: "https://lastro.dev/harness/schemas/stack-component.yaml"
